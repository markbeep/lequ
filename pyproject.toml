[project]
name = "lequ"
version = "0.1.0"
description = "Discord Bot for managing quotes"
readme = "README.md"
authors = [
    { name = "Markbeep", email = "mrkswrn@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "discord-py>=2.7.1",
    "greenlet>=3.5.6",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.47",
]

[project.scripts]
bot = "lequ:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "hypothesis>=6.170.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:(?s).*session\\.exec.*:DeprecationWarning"]

[tool.basedpyright]
typeCheckingMode = "all"
reportDeprecated = false
reportUninitializedInstanceVariable = false
reportUnusedCallResult = false
